# Xiaomi Pen 2 - impostazioni del ponte nabu-pen-bridge
# Dopo una modifica: sudo systemctl restart nabu-pen-bridge

# Previsione del tratto: di quanti millisecondi "anticipare" la punta (0 = spenta)
PREDICT_MS=8
# Spostamento massimo dovuto alla previsione, in pixel
PREDICT_MAX_PX=12
# Finestra (ms) su cui si stima la velocita' della penna
PREDICT_WINDOW_MS=17
# Smussamento del tratto (filtro One Euro): taglio minimo in Hz (piu' basso = piu' liscio ma piu'
# ritardo; 0 = spento) e beta (quanto si riduce lo smussamento quando la penna va veloce)
SMOOTH_MIN_CUTOFF=0
SMOOTH_BETA=0.05
# Movimento minimo (pixel) prima che parta la previsione: tap e pressioni lunghe restano esatti
TAP_SLOP_PX=12

# Palm rejection: ignora le dita quando la penna e' vicina allo schermo (1 = attivo, 0 = spento)
PALM_REJECTION=1
# Per quanto tempo dopo che la penna si allontana le dita restano ignorate (ms)
PALM_GRACE_MS=400
# Senza eventi dalla penna per questo tempo la si considera lontana (ms)
PEN_TIMEOUT_MS=300
